name: "ETH2MQTT"
version: "1.0.0"
slug: "eth2mqtt"
description: "MQTT gateway for Devantech ETH00x/ETH80xx/dScript relay & I/O boards, with Home Assistant MQTT discovery"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: services
boot: auto
services:
  - "mqtt:want"
map:
  - "addon_config:rw"
ports:
  "17494/tcp": 17494
ports_description:
  "17494/tcp": "Devantech board push/event listener - point your boards' network configuration at the Home Assistant host on this port"
options:
  log_level: info
  poll_interval: 10
  discovery_prefix: homeassistant
  topic_prefix: eth2mqtt
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  log_level: "list(debug|info|warning|error)?"
  poll_interval: "int(2,300)?"
  discovery_prefix: "str?"
  topic_prefix: "str?"
  mqtt_host: "str?"
  mqtt_port: "port?"
  mqtt_username: "str?"
  mqtt_password: "password?"
