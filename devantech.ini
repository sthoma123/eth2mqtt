#-----------------------------------------------------------------------------
# [boxes]: every Devantech box the gateway should poll/control.
#   box_id = hostname_or_ip[:port]        (port defaults to 17494)
# box_id is what shows up in MQTT topics (eth2mqtt/<box_id>/...) and is what
# the ETH/<box_id>/... keys below refer to (matched case-insensitively).
#
# [METADATA]: aliases, same syntax as pvOpt used, so this section can be
# copied straight out of sigiHome.ini.
#   ETH/<box_id>                = Box display name, ,
#   ETH/<box_id>/<n>            = Relay <n> name, [n], [type]      (n = 1-based relay number)
#   ETH/<box_id>/V              = Voltage sensor name, ,
#   ETH/<box_id>/A<n>           = Analog channel <n> name, [unit], [type]
#   ETH/<box_id>/I<n>           = Digital input <n> name, [n], [type]   (new boards only)
# The middle field is "n" (case-insensitive) to mark a relay/input as
# physically inverted (gateway reports/accepts the logical, non-inverted
# state), or otherwise free text used as the unit_of_measurement for analog
# channels. Anything not listed here still gets published, with a generic
# name like "<box display name> Relay <n>".
#-----------------------------------------------------------------------------
[boxes]
kellerschalter = 192.168.0.182
Kueche = 192.168.0.186
keller2 = 192.168.0.188
zaehlerschalter = 192.168.0.187
wohnzimmer = 192.168.0.185

[METADATA]
ETH/kellerschalter/2=SchwimmFilter, , int
ETH/kellerschalter/1=SchwimmSolar, , int
ETH/kellerschalter/6=MinerStrom, , int
ETH/kellerschalter/7=Automatisch, , int
ETH/kellerschalter/8=Beat, , int

ETH/kellerschalter/3=Warmwasser 1, ,int
